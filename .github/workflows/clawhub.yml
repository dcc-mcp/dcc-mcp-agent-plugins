name: Sync ClawHub Skills

on:
  workflow_call:
    inputs:
      checkout-ref:
        required: false
        type: string
        default: ""
      publish:
        required: false
        type: boolean
        default: false
    secrets:
      CLAWHUB_TOKEN:
        required: false
  pull_request:
    branches: [main]
    paths:
      - "plugins/dcc-mcp/skills/**"
      - "scripts/package_openclaw_skill.py"
      - "scripts/clawhub_sync.py"
      - "scripts/setup_released_core.py"
      - ".github/clawhub-skills.json"
      - ".github/workflows/clawhub.yml"
      - ".github/workflows/publish-clawhub.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish instead of dry-running
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: clawhub-skills-${{ github.ref }}
  cancel-in-progress: false

env:
  CLAWHUB_CLI_PACKAGE: clawhub@0.23.1
  CLAWHUB_CONFIG_PATH: .clawhub/config.json
  CLAWHUB_DISABLE_TELEMETRY: "1"

jobs:
  sync-skills:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.checkout-ref || github.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python scripts/setup_released_core.py --with-catalog-dependencies
      - run: python scripts/validate_repository.py
      - run: python -m unittest discover -s tests -q
      - run: python scripts/package_openclaw_skill.py .github/clawhub-skills.json dist/skills --manifest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clawhub-skill-packages
          path: dist/skills/*.zip
          if-no-files-found: error
      - name: Require ClawHub token
        if: inputs.publish
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: test -n "$CLAWHUB_TOKEN" || (echo "Missing CLAWHUB_TOKEN repository secret" >&2; exit 1)
      - name: Login to ClawHub
        if: inputs.publish
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          mkdir -p "$(dirname "$CLAWHUB_CONFIG_PATH")"
          npx "$CLAWHUB_CLI_PACKAGE" --no-input login --token "$CLAWHUB_TOKEN" --no-browser
      - name: Dry-run ClawHub publish
        if: ${{ !inputs.publish }}
        run: python scripts/clawhub_sync.py --dry-run
      - name: Publish Skills to ClawHub
        if: inputs.publish
        run: python scripts/clawhub_sync.py
