name: Core skill sync

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-pin:
    name: Skills match the pinned Core commit
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - id: pin
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          pin = json.loads(pathlib.Path(".github/core-skills-sync.json").read_text(encoding="utf-8"))
          print(f"repository={pin['repository'].removeprefix('https://github.com/')}")
          print(f"commit={pin['commit']}")
          PY
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ steps.pin.outputs.repository }}
          ref: ${{ steps.pin.outputs.commit }}
          path: .core
          sparse-checkout: skills
      - run: python scripts/sync_core_skills.py --source .core --check

  watch-core:
    name: Core has newer Skill content
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - id: pin
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          pin = json.loads(pathlib.Path(".github/core-skills-sync.json").read_text(encoding="utf-8"))
          print(f"repository={pin['repository'].removeprefix('https://github.com/')}")
          print(f"ref={pin['ref']}")
          PY
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ steps.pin.outputs.repository }}
          ref: ${{ steps.pin.outputs.ref }}
          path: .core
          sparse-checkout: skills
      - name: Compare against the Core branch
        run: |
          echo "A failure here means Core published newer Skill content."
          echo "Re-sync, bump the Skill suite version, and release:"
          echo "  python scripts/sync_core_skills.py --source <core-checkout>"
          python scripts/sync_core_skills.py --source .core --check
