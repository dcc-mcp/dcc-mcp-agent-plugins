name: Publish merged ClawHub Skills

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Explicitly authorize real ClawHub publication (leave off while paused)
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "plugins/dcc-mcp/skills/**"
      - "scripts/package_openclaw_skill.py"
      - "scripts/clawhub_sync.py"
      - "scripts/setup_released_core.py"
      - ".github/clawhub-skills.json"
      - ".github/workflows/clawhub.yml"
      - ".github/workflows/publish-clawhub.yml"

permissions:
  contents: read

jobs:
  publish:
    # A merge/push must never publish. Only an explicit manual opt-in can.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
    uses: ./.github/workflows/clawhub.yml
    with:
      checkout-ref: ${{ github.sha }}
      publish: true
    secrets: inherit
