name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  github-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install "dcc-mcp-core==0.19.91"
      - run: python scripts/validate_repository.py
      - name: Package release
        run: |
          version=${GITHUB_REF_NAME#v}
          manifest_version=$(python -c 'import json; print(json.load(open("plugins/dcc-mcp/.codex-plugin/plugin.json"))["version"])')
          test "$version" = "$manifest_version"
          python scripts/package_openclaw_skill.py .github/clawhub-skills.json dist/skills --manifest
          git archive --format=zip --prefix=dcc-mcp/ --output="dist/dcc-mcp-agent-plugin-${version}.zip" HEAD:plugins/dcc-mcp
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/**/*.zip dist/*.zip --verify-tag --generate-notes

  publish-clawhub:
    needs: github-release
    uses: ./.github/workflows/clawhub.yml
    with:
      checkout-ref: ${{ github.ref }}
      publish: true
    secrets: inherit

  publish-smithery:
    needs: github-release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Publish Skills to Smithery
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
        run: python scripts/smithery_sync.py --publish
