name: Publication gates

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publication-gates-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  status-start:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    env:
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: Validate status revisions before checkout
        run: |
          python3 -I - <<'PY'
          import os
          import re

          for name in ("BASE_SHA", "HEAD_SHA"):
              value = os.environ[name]
              if not re.fullmatch(r"[0-9a-f]{40}", value) or value == "0" * 40:
                  raise SystemExit(f"{name} must be a nonzero, lowercase 40-hex commit SHA")
          PY
      - name: Check out only the trusted status publisher
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Publish pending status on the event HEAD
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git --no-replace-objects rev-parse HEAD)" = "$BASE_SHA"
          publisher="$GITHUB_WORKSPACE/scripts/report_publication_status.py"
          if [[ ! -f "$publisher" || -L "$publisher" ]]; then
            printf '%s\n' 'Trusted baseline status publisher is missing or not a regular file; candidate fallback is forbidden.' >&2
            exit 1
          fi
          python3 -I "$publisher" --repository "$REPOSITORY" --pr-number "$PR_NUMBER" \
            --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" --head-repository "$HEAD_REPOSITORY" \
            --merge-sha="$MERGE_SHA" --run-id "$RUN_ID" --phase start

  publication-gates:
    needs: status-start
    if: >-
      ${{ !cancelled() && (github.event_name == 'push' || needs.status-start.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      policy-enforced: ${{ steps.policy.outputs.enforced || 'false' }}
      parents-verified: ${{ steps.candidate.outputs.verified || 'false' }}
    steps:
      - name: Validate event revisions before using Git
        id: revisions
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          python3 -I - <<'PY'
          import os
          import re

          def revision(name):
              value = os.environ[name]
              if not re.fullmatch(r"[0-9a-f]{40}", value) or value == "0" * 40:
                  raise SystemExit(f"{name} must be a nonzero, lowercase 40-hex commit SHA")
              return value

          if os.environ["EVENT_NAME"] == "pull_request_target":
              values = {
                  "base": revision("PR_BASE_SHA"),
                  "candidate": revision("PR_MERGE_SHA"),
                  "head": revision("PR_HEAD_SHA"),
              }
          elif os.environ["EVENT_NAME"] == "push":
              values = {
                  "base": revision("PUSH_BEFORE_SHA"),
                  "candidate": revision("PUSH_AFTER_SHA"),
                  "head": "",
              }
          else:
              raise SystemExit("Unsupported publication-gates event")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, value in values.items():
                  output.write(f"{key}={value}\n")
          PY

      - name: Check out only the trusted baseline
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.revisions.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Fetch candidate objects without checking them out
        id: candidate
        env:
          BASE_SHA: ${{ steps.revisions.outputs.base }}
          CANDIDATE_SHA: ${{ steps.revisions.outputs.candidate }}
          HEAD_SHA: ${{ steps.revisions.outputs.head }}
        run: |
          python -I - <<'PY'
          import os
          import subprocess

          base = os.environ["BASE_SHA"]
          candidate = os.environ["CANDIDATE_SHA"]
          head = os.environ["HEAD_SHA"]

          def git(*args):
              return subprocess.check_output(["git", "--no-replace-objects", *args], text=True).strip()

          if git("rev-parse", "HEAD") != base:
              raise SystemExit("Trusted checkout does not match the event baseline")
          git("-c", "protocol.file.allow=never", "fetch", "--no-tags",
              "--no-recurse-submodules", "origin", candidate)
          if git("rev-parse", "--verify", f"{candidate}^{{commit}}") != candidate:
              raise SystemExit("Candidate does not identify the exact fetched commit")
          if head:
              parents = git("rev-list", "--parents", "-n", "1", candidate).split()
              if parents != [candidate, base, head]:
                  raise SystemExit("PR merge commit must have exactly the event base/head parents")
          else:
              subprocess.run(
                  ["git", "--no-replace-objects", "merge-base", "--is-ancestor", base, candidate],
                  check=True,
              )
          PY
          printf '%s\n' 'verified=true' >> "$GITHUB_OUTPUT"

      - name: Require the baseline checker or report the one-time bootstrap
        id: checker
        env:
          BASE_SHA: ${{ steps.revisions.outputs.base }}
        run: |
          python -I - <<'PY'
          import os
          from pathlib import Path

          checker = Path("scripts/check_publication_gates.py")
          if checker.is_file() and not checker.is_symlink():
              enabled = "true"
          elif (not checker.exists() and not checker.is_symlink()
                and os.environ["BASE_SHA"] == "213194ff992c28951fbbb37473199c33af6ebfb2"):
              enabled = "false"
              message = (
                  "BOOTSTRAP NOT ENFORCED: the exact pre-gate baseline has no checker. "
                  "This run does not prove publication-policy compliance. "
                  "The introducing change requires separate self-tests and review."
              )
              print(f"::warning title=Publication gates bootstrap::{message}")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write(f"## Publication gates: BOOTSTRAP NOT ENFORCED\n\n{message}\n")
          else:
              raise SystemExit("Trusted baseline publication checker is missing or not a regular file")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"enabled={enabled}\n")
          PY

      - name: Install only the pinned checker dependency
        if: steps.checker.outputs.enabled == 'true'
        run: >-
          python -I -m pip --isolated install --no-input --disable-pip-version-check
          --no-cache-dir --no-deps --only-binary=:all:
          --index-url https://pypi.org/simple PyYAML==6.0.3

      - name: Enforce publication policy with the baseline checker
        id: policy
        if: steps.checker.outputs.enabled == 'true'
        env:
          BASE_SHA: ${{ steps.revisions.outputs.base }}
          CANDIDATE_SHA: ${{ steps.revisions.outputs.candidate }}
          HEAD_SHA: ${{ steps.revisions.outputs.head }}
        run: |
          gate_args=(--repository "$GITHUB_WORKSPACE" --base-sha "$BASE_SHA" --candidate-sha "$CANDIDATE_SHA")
          if [[ -n "$HEAD_SHA" ]]; then
            gate_args+=(--head-sha "$HEAD_SHA")
          fi
          python -I "$GITHUB_WORKSPACE/scripts/check_publication_gates.py" "${gate_args[@]}"
          printf '%s\n' 'enforced=true' >> "$GITHUB_OUTPUT"
          printf '%s\n' '## Publication gates: enforced' '' \
            "Trusted baseline: $BASE_SHA" "Candidate: $CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"

  status-finish:
    needs: [status-start, publication-gates]
    if: ${{ always() && github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    env:
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      RUN_ID: ${{ github.run_id }}
      VALIDATION_RESULT: ${{ needs.publication-gates.result }}
      POLICY_ENFORCED: ${{ needs.publication-gates.outputs.policy-enforced || 'false' }}
      PARENTS_VERIFIED: ${{ needs.publication-gates.outputs.parents-verified || 'false' }}
    steps:
      - name: Validate status revisions before checkout
        run: |
          python3 -I - <<'PY'
          import os
          import re

          for name in ("BASE_SHA", "HEAD_SHA"):
              value = os.environ[name]
              if not re.fullmatch(r"[0-9a-f]{40}", value) or value == "0" * 40:
                  raise SystemExit(f"{name} must be a nonzero, lowercase 40-hex commit SHA")
          PY
      - name: Check out only the trusted status publisher
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Publish the terminal status on the event HEAD
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git --no-replace-objects rev-parse HEAD)" = "$BASE_SHA"
          publisher="$GITHUB_WORKSPACE/scripts/report_publication_status.py"
          if [[ ! -f "$publisher" || -L "$publisher" ]]; then
            printf '%s\n' 'Trusted baseline status publisher is missing or not a regular file; candidate fallback is forbidden.' >&2
            exit 1
          fi
          python3 -I "$publisher" --repository "$REPOSITORY" --pr-number "$PR_NUMBER" \
            --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" --head-repository "$HEAD_REPOSITORY" \
            --merge-sha="$MERGE_SHA" --run-id "$RUN_ID" --phase finish \
            --validation-result "$VALIDATION_RESULT" --policy-enforced "$POLICY_ENFORCED" \
            --parents-verified "$PARENTS_VERIFIED"
