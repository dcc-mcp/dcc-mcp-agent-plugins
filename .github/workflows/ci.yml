name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product-discovery:
    name: product-discovery (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cli: .released-cli/dcc-mcp-cli
          - os: macos-latest
            cli: .released-cli/dcc-mcp-cli
          - os: windows-latest
            cli: .released-cli/dcc-mcp-cli.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python scripts/setup_released_core.py --with-catalog-dependencies --ensure-cli-dir .released-cli
      - run: python -m unittest discover -s tests -v
      - run: python scripts/sync_product_discovery.py --check --check-core-catalog --check-cli --cli "${{ matrix.cli }}"

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - run: python scripts/setup_released_core.py --with-catalog-dependencies
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_repository.py
      - name: Validate universal Agent Skills installation
        env:
          DISABLE_TELEMETRY: "1"
        run: |
          install_root=$(mktemp -d)
          cd "$install_root"
          npx --yes skills@1.5.22 add "$GITHUB_WORKSPACE" \
            --skill dcc-mcp \
            --agent codex claude-code codebuddy gemini-cli github-copilot cursor \
              windsurf opencode cline roo kiro-cli amp openhands continue replit \
            --copy --yes
          for path in \
            .agents .claude .codebuddy .continue .kiro .openhands .roo .windsurf; do
            test -f "$path/skills/dcc-mcp/SKILL.md"
            grep -q "虚幻引擎" "$path/skills/dcc-mcp/SKILL.md"
          done
      - name: Build the GEO catalog and site
        run: python scripts/build_geo_site.py --check
      - name: Stage and dry-run the npm package
        run: |
          python scripts/build_npm_package.py
          npm pack ./dist/npm --dry-run
      - run: python scripts/package_openclaw_skill.py .github/clawhub-skills.json dist/skills --manifest
      - name: Package agent plugin
        run: |
          version=$(python -c 'import json; print(json.load(open("plugins/dcc-mcp/.codex-plugin/plugin.json"))["version"])')
          archive="dist/dcc-mcp-agent-plugin-${version}.zip"
          git archive --format=zip --prefix=dcc-mcp/ --output="$archive" HEAD:plugins/dcc-mcp
          python -c 'import sys, zipfile; archive=zipfile.ZipFile(sys.argv[1]); assert "虚幻引擎" in archive.read("dcc-mcp/skills/dcc-mcp/SKILL.md").decode("utf-8")' "$archive"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-plugin-packages
          path: dist/**/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: geo-catalog-site
          path: site
          if-no-files-found: error
