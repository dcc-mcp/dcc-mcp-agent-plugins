interface:
  display_name: "DCC-CUA"
  short_description: "Project UI control with a fail-closed provider boundary"
  default_prompt: "Use $dcc-cua for this UI task. If no process target is supplied, use only bounded list_apps/list_windows discovery and an authorized launch_app, then bind the returned exact PID/HWND before any application-window observation or input. Report provider=dcc-cua, runtime, PID, and HWND before that observation, verify the final state, hand password/SSO/MFA/CAPTCHA/security challenges to the user, and never substitute generic Codex Computer Use, computer-use, @oai/sky, or Browser/Chrome plugins."
