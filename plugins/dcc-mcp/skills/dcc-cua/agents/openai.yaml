interface:
  display_name: "DCC-CUA"
  short_description: "Project UI control with a fail-closed provider boundary"
  default_prompt: "Use $dcc-cua for this UI task. With no target, use bounded metadata-only list_apps/list_windows discovery. Bind a discovered exact PID/HWND without launching an application. Use launch_app only when the user requests a launch and the task grant permits it, then bind the returned exact PID/HWND. Discovery must not capture pixels, read a DOM or accessibility tree, or send input. Before the first application-window observation or input, report provider=dcc-cua, runtime, exact PID, and exact HWND. Verify the final state, hand password/SSO/MFA/CAPTCHA/security challenges to the user, and never substitute generic Codex Computer Use, computer-use, @oai/sky, or Browser/Chrome plugins."
