interface:
  display_name: "DCC-MCP"
  short_description: "Route 35 released creative products and 3 current application routes and DCC-CUA application UI"
  default_prompt: "Use $dcc-mcp for released-product discovery and typed DCC-MCP tools first. For any DCC-MCP application UI behavior, including browser and non-DCC application UI, use project-owned DCC-CUA through ui-control; explicit DCC-CUA requests are a hard provider boundary. Before the first UI observation or input report provider=dcc-cua, runtime, exact PID, and exact HWND. Use a fresh observation and latest snapshot or semantic reference for each action, verify with post-action readback, stop on interruption or permission failure, and hand CAPTCHA, authentication, or security challenges to the human. Never substitute generic Codex/OpenAI Computer Use, computer-use, @oai/sky, Browser, or Chrome plugins. When a user provides an absolute local application path, save it in the local application path cache. On a later request, run the cache prompt and verify the cached path still exists, tell the user which path was found, and ask for explicit confirmation before starting the software. If it is missing, ask whether the user wants the host application installed. For a product record with `host_install`, show its official HTTPS source and wait for explicit consent before downloading or installing; keep host software installation separate from the DCC-MCP adapter command. Guide the user to provide a new absolute path or use the catalog install command; never launch automatically."
